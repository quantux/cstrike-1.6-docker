# Compose unico para o servidor de CS 1.6 (ReHLDS).
#
# A imagem e puxada do Docker Hub (quantux1/cstrike-1.6-docker) — multiplataforma
# para linux/amd64 (nativo) e linux/arm64 (via Box86). A plataforma de execucao
# e escolhida por env:
#   PLATFORM=linux/amd64   (padrao, hosts x86_64)
#   PLATFORM=linux/arm64   (Raspberry Pi, NAS arm64, etc.)
#   TAG=latest|arm64       tag da imagem a usar
#
# Uso:
#   docker compose up -d
#   PLATFORM=linux/arm64 TAG=arm64 docker compose up -d

services:
  cs-server:
    image: quantux1/cstrike-1.6-docker:${TAG:-latest}
    container_name: cstrike-1.6-docker
    platform: ${PLATFORM:-linux/amd64}
    restart: unless-stopped
    environment:
      # Senhas injetadas no server.cfg pelo entrypoint.
      # Valores de exemplo: troque localmente e NAO commite as reais.
      RCON_PASSWORD: "admin123"
      SV_PASSWORD: "ggwp"
      # Regras de jogo / rotacao de mapa.
      # Por padrao (valores 0) cada mapa dura para sempre e o servidor so
      # troca de mapa manualmente (via RCON `changelevel` ou restart).
      #
      # Para ciclo automatico: defina pelo menos UM limite abaixo como > 0
      # e preencha a MAP_CYCLE com os mapas desejados (todos devem ter o
      # arquivo .bsp em ./cstrike/maps/). O ciclo usa o primeiro mapa como
      # inicial.
      #
      #   MP_TIMELIMIT  = max. de MINUTOS por mapa (ex.: "15" = 15 min).
      #   MP_MAXROUNDS  = max. de rodadas por mapa (ex.: "20").
      #   MP_WINLIMIT   = mapas vencidos p/ encerrar a partida (ex.: "8").
      #                   (o que acontecer primeiro encerra o mapa)
      #
      # Ex. rotacao automatica:
      #   MP_TIMELIMIT: "15"                       -> 15 min por mapa
      #   MP_MAXROUNDS: "0"                        # rounds ilimitados
      #   MP_WINLIMIT: "0"                         # sem limite de vitorias
      #   MAP_CYCLE: "de_dust2 de_inferno de_nuke" # ordem de rotacao
      MP_TIMELIMIT: "0"
      MP_MAXROUNDS: "0"
      MP_WINLIMIT: "0"
      # MAP_CYCLE: lista de mapas (separados por espaco) que definira o
      # ./cstrike/mapcycle.txt. Se deixado VAZIO, mantem o mapcycle.txt que
      # ja existe no volume (nao mexe nele).
      # Ex.: "de_dust2 de_aztec de_dust"
      MAP_CYCLE: ""
    ports:
      - "27015:27015"
      - "27015:27015/udp"
    volumes:
      # Conteudo do jogo (mapas, addons, configs). Editavel sem rebuild:
      # adicione/remova arquivos e reinicie o container.
      - ./cstrike:/opt/steam/hlds/cstrike
    command: ["+map", "de_dust2", "+maxplayers", "16"]
    healthcheck:
      # O processo do servidor esta vivo e a porta UDP esta aberta.
      test: ["CMD-SHELL", "pgrep -f hlds_linux >/dev/null && bash -c 'exec 3<>/dev/udp/127.0.0.1/27015' >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

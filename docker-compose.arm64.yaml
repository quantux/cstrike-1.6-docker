# Compose especifico para a plataforma ARM64 (aarch64).
# Usa o Dockerfile.arm64 (base nativa aarch64 + emulador Box86).
#
# Uso:
#   docker compose -f docker-compose.arm64.yaml up -d --build
services:
  cs-server:
    build:
      context: .
      dockerfile: Dockerfile.arm64
    image: quantux1/cstrike-1.6-docker:arm64
    container_name: cstrike-1.6-docker-arm64
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "27015:27015"
      - "27015:27015/udp"
    volumes:
      - ./cstrike:/opt/steam/hlds/cstrike
    command: ["+map", "de_dust2", "+maxplayers", "16"]